name: Sync Codeforces Submissions

on:
  schedule:
    # Runs everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Build Submissions
        env:
          CF_COOKIES: ${{ secrets.CF_COOKIES }}
        run: |
          python scripts/sync_codeforces.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain Codeforces README.md)" ]; then
            git add Codeforces/ README.md
            git commit -m "chore(sync): update Codeforces solutions and stats [skip ci]"
            git push
          else
            echo "No new submissions or changes found."
          fi
